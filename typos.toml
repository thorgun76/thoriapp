# Configuración de corrección ortográfica del proyecto.
#
# El código, los comentarios y la documentación están en español, así que el
# diccionario inglés marca casi todas las palabras como erróneas. No se puede
# "activar español": `typos` no tiene diccionario español. La solución admitida
# es declarar aquí las palabras que no son errores.
#
# Se usa `extend-words` y no `extend-identifiers` porque los nombres del código
# son compuestos (`comandoManualDe`, `ArgumentosConservados`): `extend-identifiers`
# solo casa el identificador completo y dejaría pasar cada compuesto. El riesgo
# de `extend-words` es reescribir subcadenas ajenas; aquí no aplica porque son
# palabras españolas que no forman parte de palabras inglesas del proyecto.

[default]
# El código es español; el inglés solo aparece en API/librerías.
locale = "en"

[default.extend-words]
# --- Palabras españolas de uso corriente en dominio y comentarios ---
comando = "comando"
comandos = "comandos"
Comando = "Comando"
Comandos = "Comandos"
argumento = "argumento"
argumentos = "argumentos"
Argumentos = "Argumentos"
sesion = "sesion"
sesiones = "sesiones"
