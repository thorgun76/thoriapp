[package]
name = "thoriapp"
version = "1.0.0"
description = "Optimizador de juegos para Linux"
authors = ["Linux Gaming Community"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
# Nota: NO se usa tauri-plugin-shell. `open_url` llama a `xdg-open` con
# `std::process::Command` y validación de host, así que el plugin (y su permiso
# `shell:allow-open`) sería superficie de ataque sin uso.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", features = ["json"] }
sysinfo = "0.31"
dirs = "5.0"
walkdir = "2.5"
glob = "0.3"
chrono = "0.4"
thiserror = "1.0"
anyhow = "1.0"
regex = "1.10"
rusqlite = { version = "0.32", features = ["bundled"] }
# Carátulas locales -> data URI base64
base64 = "0.22"
# Nombre de archivo que Heronite usa en su caché de imágenes (sha256 de la URL)
sha2 = "0.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
